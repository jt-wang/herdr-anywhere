name: Tests

# Every pull request and every push to main, ci (where a release's commit is tested before main) or a ci-* branch (a
# change tried on its own, beside the others) runs the
# tests a contributor runs locally, plus a secret scan over the whole history. The device suites (app/e2e/android*.sh,
# ios*.sh) and user-path.sh run in devices.yml, on emulators and simulators; app/e2e/run.sh runs in computers.yml,
# with herdr-core. One iOS check runs here: the app built with the iOS 27 SDK opens on an iOS 27 simulator (job ios27).
on:
  pull_request:
  push:
    # A ci-try-* branch runs nothing when pushed: a trial is run by hand (workflow_dispatch), only what it needs. The
    # "!" pattern comes after "ci-*", as GitHub applies the patterns in order.
    branches: [main, ci, "ci-*", "!ci-try-*"]
  workflow_dispatch:
    inputs:
      only_ios27:
        description: Only jobs ios27 and ios26 (the iOS 27 checks)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  NSH_VERSION: "v0.3.0"
  # SHA-256 of nsh-macos-arm64.tar.gz; matches the digest GitHub lists for the release asset.
  # Update both together.
  NSH_SHA256: "34fdd2ec43d5e22986723e7633acf9223e365bd5bace1a502b5ae24fb75c266c"

# Every run step is `bash --noprofile --norc -eo pipefail {0}` (pwsh where a step says so). A step with no shell given
# runs `bash -e {0}`, with no pipefail, and `go test … | tee log` took tee's exit 0 over a failed test.
# app/scripts/check-pipefail.sh fails on a pipe in a step without pipefail.
defaults:
  run:
    shell: bash

jobs:
  nsh-regressions:
    name: NativeShell lifecycle regressions (red and green)
    if: ${{ !inputs.only_ios27 }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang libclang-dev cmake
          rustup toolchain install 1.99.1 --profile minimal
      - name: Lifecycle fixes and failing controls
        run: |
          git clone --depth 1 --branch v0.3.0 https://github.com/longbridge/nsh "$RUNNER_TEMP/nsh-source"
          app/ios/nsh-patches/test-nsh.sh "$RUNNER_TEMP/nsh-source" "$RUNNER_TEMP/nsh-regressions"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: nsh-regressions
          path: ${{ runner.temp }}/nsh-regressions
          retention-days: 7

  companion:
    name: Companion (go test)
    if: ${{ !inputs.only_ios27 }}
    runs-on: macos-26
    # About twice its longest recent run: without it a stuck job holds one of the account's 5 macOS runners for 6 hours.
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: companion/go.mod
          cache-dependency-path: companion/go.sum
      # cmd/herdr-anywhere cross-compiles each release file: on this runner the package takes close to go test's
      # default 10 minutes with no test failing (computers.yml gives it 30 for the same reason).
      - run: go vet ./... && go test -timeout 30m ./...
        working-directory: companion
      - name: iOS pairing and early failure logs
        run: |
          python3 app/e2e/ios-pin-pair.test.py
          python3 app/e2e/ios-title-pair.test.py
      - name: Native diagnostic consent and upgrade defaults
        run: |
          swiftc app/ios/Sources/DiagnosticLog.swift app/ios/Tests/DiagnosticLogTests.swift -o "$RUNNER_TEMP/diagnostic-consent-tests"
          "$RUNNER_TEMP/diagnostic-consent-tests"
      # The filing agent's last evaluation (eval/filing/last-report.json) is for the rules and code as they are now and
      # passed. The evaluation itself needs an agent's login, so it runs where that is: run.sh.
      - run: companion/eval/filing/check.sh

  nsh-cli:
    name: Build the patched test CLI
    if: ${{ !inputs.only_ios27 }}
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: CLI cache key
        id: key
        run: echo "key=$(app/ios/nsh-patches/key.sh | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: ${{ runner.temp }}/nsh-cli
          key: nsh-cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.key.outputs.key }}-${{ hashFiles('app/ios/nsh-patches/build-nsh-cli.sh') }}
      - name: Build the CLI
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          CARGO_HOME: ${{ runner.temp }}/nsh-cli-cargo
          RUSTUP_HOME: ${{ runner.temp }}/nsh-cli-rustup
        run: |
          rustup toolchain install 1.99.1 --profile minimal --no-self-update
          export LIBCLANG_PATH="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          app/ios/nsh-patches/build-nsh-cli.sh "$RUNNER_TEMP/nsh-cli-source" "$RUNNER_TEMP/nsh-cli"
      - name: Verify CLI cache
        run: app/ios/nsh-patches/build-nsh-cli.sh --verify "$RUNNER_TEMP/nsh-cli"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/nsh-cli
          key: nsh-cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.key.outputs.key }}-${{ hashFiles('app/ios/nsh-patches/build-nsh-cli.sh') }}
      - name: Package the CLI
        run: tar -C "$RUNNER_TEMP/nsh-cli" -czf "$RUNNER_TEMP/nsh-cli.tar.gz" bin/nsh nsh-build.txt SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: patched-nsh-cli
          path: ${{ runner.temp }}/nsh-cli.tar.gz
          retention-days: 7

  app:
    name: App (unit and screen tests)
    if: ${{ !inputs.only_ios27 }}
    needs: nsh-cli
    runs-on: macos-26
    # About twice its longest recent run.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: patched-nsh-cli
          path: ${{ runner.temp }}/nsh-cli-artifact
      - name: Install the verified test CLI
        run: |
          mkdir -p "$RUNNER_TEMP/nsh-cli"
          tar -xzf "$RUNNER_TEMP/nsh-cli-artifact/nsh-cli.tar.gz" -C "$RUNNER_TEMP/nsh-cli"
          app/ios/nsh-patches/build-nsh-cli.sh --verify "$RUNNER_TEMP/nsh-cli"
          echo "$RUNNER_TEMP/nsh-cli/bin" >> "$GITHUB_PATH"
          echo "NSH_CACHE=$RUNNER_TEMP/nsh-cli-cache" >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: companion/go.mod
          cache-dependency-path: companion/go.sum
      - run: python3 ios/nsh-patches/build-nsh-cli.test.py
        working-directory: app
      - run: sh app/e2e/ios-open-space-test.sh --mutations
      - run: nsh --version && nsh check && scripts/test.sh
        working-directory: app
      - run: python3 e2e/chat-away-check.test.py
        working-directory: app
      - name: Keep nsh crash reports after a failed test
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/nsh-crashes"
          for reports in "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
            if [ -d "$reports" ]; then
              find "$reports" -type f -name 'nsh-*.ips' -exec cp {} "$RUNNER_TEMP/nsh-crashes/" \;
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: nsh-crashes
          path: ${{ runner.temp }}/nsh-crashes/
          retention-days: 3

  ios27:
    name: iPhone app opens on iOS 27 (simulator)
    # iOS 27 ends the launch of an app built with its SDK that has no scene (e2e/ios-scene.sh, e2e/ios-opens.sh).
    # xcode-27 is the runner image with Xcode 27 and the iOS 27 simulators.
    runs-on: xcode-27
    # About twice its longest recent run.
    timeout-minutes: 60
    env:
      XCODEGEN_VERSION: "2.45.4"
      # SHA-256 of xcodegen.zip; matches the digest GitHub lists for the release asset. Update both together.
      XCODEGEN_SHA256: "090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # TailPocket is v0.3.0, public jt-wang/tailpocket@e1aea0fafe2341985b8a5cbd98f39d9949b0e544: its Go module from the Go
      # proxy (companion/go.mod), its phone library from that release (app/scripts/tailpocket.sh checks its SHA-256),
      # its SDKs copied into third_party/tailpocket-e1aea0f.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: companion/go.mod
          cache-dependency-path: companion/go.sum
      - name: Install nsh and xcodegen
        run: |
          curl -sfL -o nsh.tar.gz "https://github.com/longbridge/nsh/releases/download/$NSH_VERSION/nsh-macos-arm64.tar.gz"
          echo "$NSH_SHA256  nsh.tar.gz" | shasum -a 256 -c -
          tar -xzf nsh.tar.gz -C "$HOME" && mv "$HOME/nsh" "$HOME/.nsh"
          echo "$HOME/.nsh/bin" >> "$GITHUB_PATH"
          curl -sfL -o xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  xcodegen.zip" | shasum -a 256 -c -
          unzip -q xcodegen.zip -d "$RUNNER_TEMP/xcodegen"
          xcodegen=$(find "$RUNNER_TEMP/xcodegen" -type f -name xcodegen -perm -u+x -print -quit)
          [ -n "$xcodegen" ] || { echo "FAIL: no xcodegen in xcodegen.zip"; exit 1; }
          dirname "$xcodegen" >> "$GITHUB_PATH"
      # The Xcode the TestFlight builds use.
      - run: sudo xcode-select -s /Applications/Xcode_27.0.app && xcodebuild -version
      - uses: ./.github/actions/nsh-ios
        with:
          xcode: /Applications/Xcode_27.0.app
      - name: Build the app for the simulator (Release)
        id: build
        run: ios/build.sh App.tsx simulator
        working-directory: app
      # The same build for job ios26 (a tar keeps the executable's mode, which an artifact alone drops).
      - run: tar -C app/ios/build -cf "$RUNNER_TEMP/Herdr.app.tar" Herdr.app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: herdr-app-xcode27-simulator
          path: ${{ runner.temp }}/Herdr.app.tar
          retention-days: 3
      - name: The build has a scene
        run: e2e/ios-scene.sh ios/build/Herdr.app
        working-directory: app
      # Runs whether or not the check above passed: each of the two must catch a build without a scene by itself. The
      # runtime is the newest iOS 27 one that has an iPhone 17 (e2e/ios-opens.sh's default); exit 2 is a simulator that
      # could not be made, not the app.
      - name: Cold start on the newest iOS 27 simulator
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: app
        run: |
          runtime=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-27") and x["isAvailable"] and "com.apple.CoreSimulator.SimDeviceType.iPhone-17" in [d["identifier"] for d in x.get("supportedDeviceTypes", [])]]; print(max(r, key=lambda x: [int(n) for n in x["version"].split(".")])["identifier"] if r else "")')
          [ -n "$runtime" ] || { echo "FAIL: no iOS 27 simulator runtime on this runner"; xcrun simctl list runtimes; exit 1; }
          SIM_RUNTIME=$runtime e2e/ios-opens.sh ios/build/Herdr.app

  ios26:
    name: The same iOS 27 SDK build opens on iOS 26 (simulator)
    # The scene change must not break the phones still on iOS 26. The xcode-27 image has no iOS 26 simulator, so job
    # ios27's build runs here, on macos-26.
    needs: ios27
    if: ${{ !cancelled() }}
    runs-on: macos-26
    # About twice its longest recent run.
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: herdr-app-xcode27-simulator
          path: ${{ runner.temp }}
      - run: mkdir -p "$RUNNER_TEMP/app" && tar -C "$RUNNER_TEMP/app" -xf "$RUNNER_TEMP/Herdr.app.tar"
      - name: Cold start on the newest iOS 26 simulator
        working-directory: app
        run: |
          runtime=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-26") and x["isAvailable"] and "com.apple.CoreSimulator.SimDeviceType.iPhone-17" in [d["identifier"] for d in x.get("supportedDeviceTypes", [])]]; print(max(r, key=lambda x: [int(n) for n in x["version"].split(".")])["identifier"] if r else "")')
          [ -n "$runtime" ] || { echo "FAIL: no iOS 26 simulator runtime on this runner"; xcrun simctl list runtimes; exit 1; }
          SIM_RUNTIME=$runtime e2e/ios-opens.sh "$RUNNER_TEMP/app/Herdr.app"

  page:
    name: Terminal page (touch and keyboard, Chromium)
    if: ${{ !inputs.only_ios27 }}
    runs-on: macos-26
    # About twice its longest recent run.
    timeout-minutes: 20
    env:
      PLAYWRIGHT_VERSION: "1.58.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install Playwright's Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm install --no-save --ignore-scripts "playwright-core@$PLAYWRIGHT_VERSION"
          node node_modules/playwright-core/cli.js install chromium
          echo "PLAYWRIGHT_DIR=$RUNNER_TEMP/pw/node_modules/playwright-core" >> "$GITHUB_ENV"
      - run: e2e/page-touch.sh
        working-directory: app
      # Oh My Pi's pictures on the page (fixtures/kitty). Its screenshots, with the same output on main's page beside
      # them, are the run's page-kitty-shots.
      - name: Pictures on the page (Kitty graphics)
        working-directory: app
        run: |
          if git fetch --depth 1 origin main && git show FETCH_HEAD:app/src/ui/terminal-page.ts > src/ui/terminal-page.before.ts; then
            export BEFORE="$PWD/src/ui/terminal-page.before.ts"
          fi
          e2e/page-kitty.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: page-kitty-shots
          path: app/e2e/out/kitty/

  secrets:
    name: Secret scan (gitleaks)
    if: ${{ !inputs.only_ios27 }}
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz; matches the digest GitHub lists for the release asset.
      # Update both together.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -sfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      # The whole history. A finding that is not a secret goes in .gitleaksignore with why and the date it was checked.
      - run: ./gitleaks git --no-banner --redact .
