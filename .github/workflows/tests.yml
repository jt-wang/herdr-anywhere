name: Spindump owned-process calibration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calibrate:
    runs-on: xcode-27
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: app/e2e/spindump-calibration.py
          sparse-checkout-cone-mode: false
      - name: Calibrate live and reaped owned PID
        run: python3 app/e2e/spindump-calibration.py --out "$RUNNER_TEMP/spindump-calibration"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: spindump-calibration
          path: ${{ runner.temp }}/spindump-calibration
          if-no-files-found: error
          retention-days: 7
