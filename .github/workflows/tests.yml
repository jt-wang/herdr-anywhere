name: Tests

# Every pull request and every push to main, ci (where a release's commit is tested before main) or a ci-* branch (a
# change tried on its own, beside the others) runs the
# tests a contributor runs locally, plus a secret scan over the whole history. The device suites (app/e2e/android*.sh,
# ios*.sh) and user-path.sh run in devices.yml, on emulators and simulators; app/e2e/run.sh runs in computers.yml,
# with herdr-core. One iOS check runs here: the app built with the iOS 27 SDK opens on an iOS 27 simulator (job ios27).
on:
  pull_request:
  push:
    # A ci-try-* branch runs nothing when pushed: a trial is run by hand (workflow_dispatch), only what it needs. The
    # "!" pattern comes after "ci-*", as GitHub applies the patterns in order.
    branches: [main, ci, "ci-*", "!ci-try-*"]
  workflow_dispatch:
    inputs:
      only_ios27:
        description: Only jobs ios27 and ios26 (the iOS 27 checks)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  NSH_VERSION: "v0.3.0"
  # SHA-256 of nsh-macos-arm64.tar.gz; matches the digest GitHub lists for the release asset.
  # Update both together.
  NSH_SHA256: "34fdd2ec43d5e22986723e7633acf9223e365bd5bace1a502b5ae24fb75c266c"

# Every run step is `bash --noprofile --norc -eo pipefail {0}` (pwsh where a step says so). A step with no shell given
# runs `bash -e {0}`, with no pipefail, and `go test … | tee log` took tee's exit 0 over a failed test.
# app/scripts/check-pipefail.sh fails on a pipe in a step without pipefail.
defaults:
  run:
    shell: bash


jobs:
  # The pipefail probe (new shell setup): never merged. Each job's result shows what a step's shell did with a
  # failure; the names say what each job ends as before the fix (old) and after it (new).
  probe-pass:
    name: "Probe: a passing go test through tee (green in both)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: companion/go.mod
          cache-dependency-path: companion/go.sum
      - working-directory: companion
        run: go test ./internal/pipefailprobe -count=1 -v | tee "$RUNNER_TEMP/probe.log"
  probe-fail:
    name: "Probe: a failing go test through tee (old green, new red)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: companion/go.mod
          cache-dependency-path: companion/go.sum
      - working-directory: companion
        env:
          HM_PROBE_FAIL: "1"
        run: |
          go test ./internal/pipefailprobe -count=1 -v | tee "$RUNNER_TEMP/probe.log"
          echo "the step went on after the failed test"
  probe-subshell:
    name: "Probe: a failing command piped to tr in a subshell, as sealed-invite open is (old green, new red)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: (umask 077; sh -c 'echo nothing; exit 1' | tr -d '\r\n' > "$RUNNER_TEMP/invite")
  probe-sigpipe-raw:
    name: "Probe: yes | head (old green, new red: SIGPIPE counts under pipefail)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: yes | head -1
  probe-sigpipe-wrapped:
    name: "Probe: { yes || true; } | head (green in both)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: "{ yes || true; } | head -1"
  probe-subst:
    name: "Probe: a failing $( ) for GITHUB_OUTPUT (old green: in echo's argument; new red: assigned first)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: prev
        run: |
          tag=$(sh -c 'echo no release >&2; exit 1')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
