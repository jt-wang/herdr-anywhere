name: NativeShell with the app's nsh patches
description: >
  nsh v0.3.0 with app/ios/nsh-patches (upstream #530, #1014, #1214, #1991 and #835) built into NativeShell.xcframework with the given
  Xcode, once per patches and Xcode, then taken from the cache. Sets NSH_IOS_EMBED, where app/ios/build.sh takes it.
inputs:
  xcode:
    description: The Xcode to build with (the job's own, as it links the framework)
    required: true
  artifact_name:
    description: Optional artifact for a release build to use this exact framework (device and simulator)
    default: ""
runs:
  using: composite
  steps:
    - name: Key
      id: key
      shell: bash
      env:
        XCODE: ${{ inputs.xcode }}
      run: |
        echo "NSH_IOS_EMBED=$RUNNER_TEMP/nsh-ios" >> "$GITHUB_ENV"
        echo "key=nsh-ios-$(app/ios/nsh-patches/key.sh | tr ' ' '-')-$(basename "$XCODE" .app)" >> "$GITHUB_OUTPUT"
    # Restored here and saved right after the build (below): actions/cache's own save runs at the job's end and only
    # when every step passed, so a job whose suites fail would build it again next time.
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: cache
      with:
        path: ${{ runner.temp }}/nsh-ios
        key: ${{ steps.key.outputs.key }}
    - name: Build it (none in the cache)
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        DEVELOPER_DIR: ${{ inputs.xcode }}/Contents/Developer
      run: |
        echo "FAIL: this diagnostic run requires the existing NativeShell cache"
        exit 1
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: steps.cache.outputs.cache-hit != 'true'
      with:
        path: ${{ runner.temp }}/nsh-ios
        key: ${{ steps.key.outputs.key }}
    - name: Package the tested framework
      if: inputs.artifact_name != ''
      shell: bash
      run: |
        test "$(cat "$NSH_IOS_EMBED/nsh-build.txt")" = "$(app/ios/nsh-patches/key.sh)"
        test -f "$NSH_IOS_EMBED/NativeShell.xcframework/ios-arm64/NativeShell.framework/NativeShell"
        test -f "$NSH_IOS_EMBED/NativeShell.xcframework/ios-arm64-simulator/NativeShell.framework/NativeShell"
        mkdir -p "$RUNNER_TEMP/nsh-ios-artifact"
        tar -C "$NSH_IOS_EMBED" -czf "$RUNNER_TEMP/nsh-ios-artifact/NativeShell-ios.tar.gz" NativeShell.xcframework nsh-build.txt
        cd "$RUNNER_TEMP/nsh-ios-artifact"
        shasum -a 256 NativeShell-ios.tar.gz > NativeShell-ios.tar.gz.sha256
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: inputs.artifact_name != ''
      with:
        name: ${{ inputs.artifact_name }}
        path: ${{ runner.temp }}/nsh-ios-artifact
        retention-days: 14
